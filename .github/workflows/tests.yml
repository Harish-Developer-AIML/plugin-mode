name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # uv installs any CPython version on every runner, including 3.8 on Apple-silicon macOS,
      # where actions/setup-python has no 3.8 build.
      - uses: astral-sh/setup-uv@v6

      - name: Install Python ${{ matrix.python }}
        shell: bash
        run: uv python install ${{ matrix.python }}

      - name: Show the interpreter and the shells the hook tests will use
        shell: bash
        run: |
          uv run --no-project --python ${{ matrix.python }} python -c "import sys; print(sys.version); print(sys.executable)"
          for s in sh dash bash zsh pwsh powershell python3 python py; do printf '%-11s %s\n' "$s" "$(command -v $s || echo '-')"; done

      - name: Unit tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --no-project --python ${{ matrix.python }} python -W error::ResourceWarning -m unittest discover -s tests -v
